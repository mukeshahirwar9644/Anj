<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Dotted Circular Emblem -->
  <circle cx="100" cy="100" r="95" fill="#F4EAE0" stroke="#D35F36" stroke-width="3"/>
  
  <!-- Perimeter Stitched Dots (12-point clock dial) -->
  <!-- Top / Bottom -->
  <circle cx="100" cy="15" r="3" fill="#D35F36"/>
  <circle cx="100" cy="185" r="3" fill="#D35F36"/>
  <!-- Left / Right -->
  <circle cx="15" cy="100" r="3" fill="#D35F36"/>
  <circle cx="185" cy="100" r="3" fill="#D35F36"/>
  <!-- 30 deg intervals -->
  <circle cx="142" cy="26" r="3" fill="#D35F36"/>
  <circle cx="174" cy="58" r="3" fill="#D35F36"/>
  <circle cx="174" cy="142" r="3" fill="#D35F36"/>
  <circle cx="142" cy="174" r="3" fill="#D35F36"/>
  <circle cx="58" cy="174" r="3" fill="#D35F36"/>
  <circle cx="26" cy="142" r="3" fill="#D35F36"/>
  <circle cx="26" cy="58" r="3" fill="#D35F36"/>
  <circle cx="58" cy="26" r="3" fill="#D35F36"/>

  <!-- Sofa Legs -->
  <rect x="52" y="125" width="10" height="15" rx="3" fill="#582415"/>
  <rect x="138" y="125" width="10" height="15" rx="3" fill="#582415"/>

  <!-- Sofa Main Backrest Cushion -->
  <rect x="48" y="65" width="104" height="65" rx="20" fill="#D35F36"/>

  <!-- Left Armrest -->
  <rect x="36" y="80" width="22" height="50" rx="10" fill="#B74B26"/>

  <!-- Right Armrest -->
  <rect x="142" y="80" width="22" height="50" rx="10" fill="#B74B26"/>

  <!-- Sofa Front Cushions -->
  <rect x="50" y="82" width="100" height="48" rx="12" fill="#D35F36"/>

  <!-- Center Cushion Split Seam Line -->
  <line x1="100" y1="83" x2="100" y2="130" stroke="#FAF4EE" stroke-width="3" stroke-linecap="round"/>
</svg>